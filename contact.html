<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>White Rock Books, LLC | Contact</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #1c2135;
    color: #f0ece5;
    font-family: 'Arial', Helvetica, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  nav {
    display: flex;
    justify-content: center;
    gap: 2.5rem;
    padding: 1.6rem 2rem;
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  nav a {
    color: #f0ece5;
    text-decoration: none;
    font-size: 0.75rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.6;
    transition: opacity 0.2s;
    padding-bottom: 2px;
    border-bottom: 1px solid transparent;
  }
  nav a:hover { opacity: 1; }
  nav a.active { opacity: 1; border-bottom-color: #b5697a; }
  main { flex: 1; display: flex; flex-direction: column; }
  .page-header {
    text-align: center;
    padding: 3.5rem 2rem 2.5rem;
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  .page-header h1 {
    font-size: clamp(1.8rem, 4vw, 2.8rem);
    font-weight: 400;
    letter-spacing: 0.02em;
  }
  .page-content {
    max-width: 860px;
    margin: 0 auto;
    padding: 3.5rem 2rem;
    width: 100%;
  }
  .contact-blocks {
    display: flex;
    flex-direction: column;
    gap: 2rem;
    max-width: 600px;
    margin: 0 auto;
  }
  .contact-block {
    border-top: 1px solid rgba(255,255,255,0.1);
    padding-top: 1.4rem;
  }
  .contact-label {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #b5697a;
    margin-bottom: 0.5rem;
  }
  .contact-value {
    font-size: 0.95rem;
    line-height: 1.7;
    opacity: 0.75;
  }
  .contact-value a {
    color: inherit;
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-color: rgba(181,105,122,0.5);
    transition: opacity 0.2s;
  }
  .contact-value a:hover { opacity: 1; }
  footer {
    text-align: center;
    padding: 1.4rem 2rem;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    opacity: 0.3;
    border-top: 1px solid rgba(255,255,255,0.07);
  }
  @media (max-width: 500px) { nav { gap: 1.5rem; } }
</style>
</head>
<body>
<nav>
  <a href="/">Home</a>
  <a href="/books.html">Books</a>
  <a href="/about.html">About</a>
  <a href="/contact.html" class="active">Contact</a>
</nav>
<main>
  <div class="page-header"><h1>Contact</h1></div>
  <div class="page-content">
    <div class="contact-blocks">
      <div class="contact-block">
        <div class="contact-label">Address</div>
        <div class="contact-value">
          White Rock Books LLC<br>
          6812 Sherburne Dr.<br>
          Dallas, TX 75231
        </div>
      </div>
      <div class="contact-block">
        <div class="contact-label">Phone</div>
        <div class="contact-value">
          <a href="tel:+12144581906">214-458-1906</a>
        </div>
      </div>
      <div class="contact-block">
        <div class="contact-label">Email</div>
        <div class="contact-value">
          <a href="mailto:contact@whiterockbooks.co">contact@whiterockbooks.co</a>
        </div>
      </div>
    </div>
  </div>
</main>
