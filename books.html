<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #1c2135;
    color: #f0ece5;
    font-family: 'Arial', Helvetica, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  nav {
    padding: 1.6rem 2rem;
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  .nav-inner {
    max-width: 600px;
    margin: 0 auto;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }
  .nav-logo {
    position: absolute;
    left: 0;
    display: flex;
    align-items: center;
    opacity: 1;
    border-bottom: none;
  }
  .nav-logo img { width: 32px; height: auto; }
  .nav-links {
    display: flex;
    align-items: center;
    gap: 2.5rem;
  }
  .nav-links a {
    color: #f0ece5;
    text-decoration: none;
    font-size: 0.75rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.6;
    transition: opacity 0.2s;
    padding-bottom: 2px;
    border-bottom: 1px solid transparent;
  }
  .nav-links a:hover { opacity: 1; }
  .nav-links a.active { opacity: 1; border-bottom-color: #b5697a; }
  .nav-right {
    position: absolute;
    right: 0;
    display: flex;
    align-items: center;
  }
  .nav-social {
    display: flex;
    align-items: center;
    color: #f0ece5;
    opacity: 0.5;
    text-decoration: none;
    transition: opacity 0.2s;
  }
  .nav-social:hover { opacity: 1; }
  .nav-burger {
    display: none;
    flex-direction: column;
    gap: 5px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    margin-left: 0.75rem;
  }
  .nav-burger span {
    display: block;
    width: 22px;
    height: 2px;
    background: #f0ece5;
    opacity: 0.7;
  }
  @media (max-width: 600px) {
    .nav-inner { justify-content: space-between; flex-wrap: wrap; }
    .nav-logo { position: static; order: 1; }
    .nav-right { position: static; order: 2; }
    .nav-burger { display: flex; }
    .nav-links {
      display: none;
      order: 3;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 0;
      border-top: 1px solid rgba(255,255,255,0.07);
      padding: 0.5rem 0 0.75rem;
      margin-top: 1rem;
    }
    .nav-links a { width: 100%; text-align: center; padding: 0.65rem 1rem; border-bottom: none; }
    nav.nav-open .nav-links { display: flex; }
  }
  main { flex: 1; display: flex; flex-direction: column; }
  .page-header {
    text-align: center;
    padding: 3rem 2rem 2.5rem;
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  .page-logo {
    width: min(100px, 25vw);
    display: block;
    margin: 0 auto 2rem;
  }
  .page-header h1 {
    font-family: 'Monoton', cursive;
    font-size: clamp(3.6rem, 8vw, 5.6rem);
    font-weight: 400;
    letter-spacing: 0.02em;
  }
  .page-content {
    max-width: 860px;
    margin: 0 auto;
    padding: 3.5rem 2rem;
    width: 100%;
  }
  .books-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 2rem;
  }
  .book-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.09);
    border-top: 3px solid #b5697a;
    padding: 2.2rem 2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 0.6rem;
    transition: background 0.2s;
  }
  .book-card:hover { background: rgba(255,255,255,0.07); }
  .book-cover {
    width: 100%;
    max-width: 180px;
    height: auto;
    display: block;
    margin-bottom: 0.8rem;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .book-author {
    font-size: 0.68rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #b5697a;
  }
  .book-title {
    font-size: 1.4rem;
    font-weight: 600;
    line-height: 1.2;
  }
  .book-link {
    display: inline-block;
    margin-top: 0.8rem;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #f0ece5;
    text-decoration: none;
    border: 1px solid rgba(255,255,255,0.25);
    padding: 0.6rem 1.2rem;
    transition: border-color 0.2s, color 0.2s;
  }
  .book-link:hover { border-color: #b5697a; color: #b5697a; }
  footer {
    text-align: center;
    padding: 1.4rem 2rem;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    opacity: 0.3;
    border-top: 1px solid rgba(255,255,255,0.07);
  }
  @media (max-width: 500px) { nav { gap: 1.5rem; } }
</style>
</head>

  </div>
</nav>

      </div>
    </div>
  </div>
