<title>White Rock Books, LLC | Contemporary Romance Publisher in Dallas, TX</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #1c2135;
    color: #f0ece5;
    font-family: 'Arial', Helvetica, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  nav {
    display: flex;
    justify-content: center;
    gap: 2.5rem;
    padding: 1.6rem 2rem;
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  nav a {
    color: #f0ece5;
    text-decoration: none;
    font-size: 0.75rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.6;
    transition: opacity 0.2s;
    padding-bottom: 2px;
    border-bottom: 1px solid transparent;
  }
  nav a:hover { opacity: 1; }
  nav a.active { opacity: 1; border-bottom-color: #b5697a; }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
    position: relative;
  }
  main::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 25% 55%, rgba(181,105,122,0.14) 0%, transparent 55%),
      radial-gradient(ellipse at 78% 25%, rgba(181,105,122,0.09) 0%, transparent 50%);
    pointer-events: none;
  }
  .eyebrow {
    font-size: 0.68rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #b5697a;
    margin-bottom: 2rem;
    text-align: center;
  }
  .home-logo {
    width: min(420px, 82vw);
    display: block;
  }
  footer {
    text-align: center;
    padding: 1.4rem 2rem;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    opacity: 0.3;
    border-top: 1px solid rgba(255,255,255,0.07);
  }
  @media (max-width: 500px) { nav { gap: 1.5rem; } }
</style>
</head>
