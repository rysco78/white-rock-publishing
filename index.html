<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>White Rock Books — Coming Soon</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    background: #1c2135;
    color: #f0ece5;
    font-family: 'Georgia', 'Times New Roman', serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 3rem 2rem;
    position: relative;
  }

  main::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 25% 55%, rgba(181,105,122,0.14) 0%, transparent 55%),
      radial-gradient(ellipse at 78% 25%, rgba(181,105,122,0.09) 0%, transparent 50%);
    pointer-events: none;
  }

  .eyebrow {
    font-family: 'Arial', sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #b5697a;
    margin-bottom: 2.5rem;
  }

  .logo {
    width: min(380px, 80vw);
    margin-bottom: 3rem;
  }

  .coming-soon {
    font-size: clamp(1rem, 2.5vw, 1.2rem);
    font-style: italic;
    opacity: 0.55;
    letter-spacing: 0.06em;
    margin-bottom: 3rem;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: #b5697a;
    margin: 0 auto 2.5rem;
    opacity: 0.6;
  }

  .contact {
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
  }

  .contact-item {
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
  }

  .contact-label {
    font-family: 'Arial', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #b5697a;
  }

  .contact-value {
    font-family: 'Arial', sans-serif;
    font-size: 0.92rem;
    opacity: 0.75;
    line-height: 1.5;
  }

  .contact-value a {
    color: inherit;
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-color: rgba(181,105,122,0.5);
    transition: opacity 0.2s;
  }

  .contact-value a:hover {
    opacity: 1;
  }

  footer {
    text-align: center;
    padding: 1.5rem 2rem;
    font-family: 'Arial', sans-serif;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    opacity: 0.3;
    border-top: 1px solid rgba(255,255,255,0.07);
  }
</style>
</head>
<body>

<main>
  <p class="eyebrow">Dallas, TX &nbsp;·&nbsp; Est. 2026</p>
  <img src="Logo-1-Full-Logo-White.png" alt="White Rock Books" class="logo">
  <div class="divider"></div>
  <div class="contact">
    <div class="contact-item">
      <span class="contact-label">Address</span>
      <span class="contact-value">
        White Rock Books LLC<br>
        4849 Greenville Ave, Ste 100<br>
        Dallas, TX 75206
      </span>
    </div>
    <div class="contact-item">
      <span class="contact-label">Contact</span>
      <span class="contact-value">
        <a href="mailto:contact@whiterockbooks.co">contact@whiterockbooks.co</a>
      </span>
    </div>
  </div>
</main>

<footer>
  &copy; 2026 White Rock Books LLC &nbsp;|&nbsp; All Rights Reserved
</footer>

</body>
</html>
