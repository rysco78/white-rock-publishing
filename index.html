<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #1c2135;
    color: #f0ece5;
    font-family: 'Arial', Helvetica, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  nav {
    padding: 1.6rem 2rem;
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  .nav-inner {
    max-width: 600px;
    margin: 0 auto;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }
  .nav-logo {
    position: absolute;
    left: 0;
    display: flex;
    align-items: center;
    opacity: 1;
    border-bottom: none;
  }
  .nav-logo img { width: 32px; height: auto; }
  .nav-links {
    display: flex;
    align-items: center;
    gap: 2.5rem;
  }
  .nav-links a {
    color: #f0ece5;
    text-decoration: none;
    font-size: 0.75rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.6;
    transition: opacity 0.2s;
    padding-bottom: 2px;
    border-bottom: 1px solid transparent;
  }
  .nav-links a:hover { opacity: 1; }
  .nav-links a.active { opacity: 1; border-bottom-color: #b5697a; }
  .nav-right {
    position: absolute;
    right: 0;
    display: flex;
    align-items: center;
  }
  .nav-social {
    display: flex;
    align-items: center;
    color: #f0ece5;
    opacity: 0.5;
    text-decoration: none;
    transition: opacity 0.2s;
  }
  .nav-social:hover { opacity: 1; }
  .nav-burger {
    display: none;
    flex-direction: column;
    gap: 5px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    margin-left: 0.75rem;
  }
  .nav-burger span {
    display: block;
    width: 22px;
    height: 2px;
    background: #f0ece5;
    opacity: 0.7;
  }
  @media (max-width: 600px) {
    .nav-inner { justify-content: space-between; flex-wrap: wrap; }
    .nav-logo { position: static; order: 1; }
    .nav-right { position: static; order: 2; }
    .nav-burger { display: flex; }
    .nav-links {
      display: none;
      order: 3;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 0;
      border-top: 1px solid rgba(255,255,255,0.07);
      padding: 0.5rem 0 0.75rem;
      margin-top: 1rem;
    }
    .nav-links a { width: 100%; text-align: center; padding: 0.65rem 1rem; border-bottom: none; }
    nav.nav-open .nav-links { display: flex; }
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
    position: relative;
  }
  main::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 25% 55%, rgba(181,105,122,0.14) 0%, transparent 55%),
      radial-gradient(ellipse at 78% 25%, rgba(181,105,122,0.09) 0%, transparent 50%);
    pointer-events: none;
  }
  .eyebrow {
    font-size: 0.68rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #b5697a;
    margin-bottom: 2rem;
    text-align: center;
  }
  .home-logo {
    width: min(420px, 82vw);
    display: block;
  }
  footer {
    text-align: center;
    padding: 1.4rem 2rem;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    opacity: 0.3;
    border-top: 1px solid rgba(255,255,255,0.07);
  }
  @media (max-width: 500px) { nav { gap: 1.5rem; } }
</style>
